name: Temporary README image capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app and export its icon
        run: |
          set -euo pipefail
          bash Scripts/package-app.sh
          mkdir -p "$RUNNER_TEMP/readme-images"
          sips -s format png "dist/Quick Drop Zone.app/Contents/Resources/AppIcon.icns" --out "$RUNNER_TEMP/readme-images/quick-drop-zone-icon.png" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: quick-drop-zone-readme-images
          path: ${{ runner.temp }}/readme-images/*.png
          if-no-files-found: error
          retention-days: 7
