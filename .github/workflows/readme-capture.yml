name: Temporary README screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash Scripts/package-app.sh
      - name: Seed harmless sample filenames and capture the review screen
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Downloads" "$RUNNER_TEMP/readme-images"
          touch "$HOME/Downloads/Atlas-project-brief.pdf" "$HOME/Downloads/Atlas-review-notes.md" "$HOME/Downloads/Atlas-timeline.xlsx" "$HOME/Downloads/Atlas-assets.txt"
          cat > "$RUNNER_TEMP/capture.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          import ImageIO
          import UniformTypeIdentifiers
          import Foundation
          let args = CommandLine.arguments
          guard args.count == 3 else { fatalError("owner and output required") }
          let owner = args[1]
          let output = URL(fileURLWithPath: args[2])
          let ownerKey = kCGWindowOwnerName as String
          let layerKey = kCGWindowLayer as String
          let numberKey = kCGWindowNumber as String
          let windows = (CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]]) ?? []
          guard let row = windows.first(where: { ($0[ownerKey] as? String) == owner && ($0[layerKey] as? Int ?? 0) == 0 }),
                let number = row[numberKey] as? CGWindowID,
                let image = CGWindowListCreateImage(.null, .optionIncludingWindow, number, [.boundsIgnoreFraming, .bestResolution]),
                let destination = CGImageDestinationCreateWithURL(output as CFURL, UTType.png.identifier as CFString, 1, nil) else {
            fputs("Could not capture a visible window for \(owner)\n", stderr); exit(1)
          }
          CGImageDestinationAddImage(destination, image, nil)
          guard CGImageDestinationFinalize(destination) else { exit(2) }
          SWIFT
          APP="dist/Quick Drop Zone.app"
          open "$APP"
          sleep 4
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "SystemUIServer"
              click (first menu bar item of menu bar 1 whose name contains "Quick Drop Zone")
              delay 1
            end tell
          end tell
          APPLESCRIPT
          sleep 2
          sips -s format png "$APP/Contents/Resources/AppIcon.icns" --out "$RUNNER_TEMP/readme-images/quick-drop-zone-icon.png" >/dev/null
          swift "$RUNNER_TEMP/capture.swift" QuickDropZone "$RUNNER_TEMP/readme-images/quick-drop-zone-window.png"
      - uses: actions/upload-artifact@v4
        with:
          name: quick-drop-zone-readme-images
          path: ${{ runner.temp }}/readme-images/*.png
          if-no-files-found: error
          retention-days: 7
