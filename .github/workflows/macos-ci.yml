name: macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and package on macOS 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Record and verify Xcode and SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk_version"
          sdk_major="${sdk_version%%.*}"
          test "$sdk_major" -ge 26
      - name: Run automated core tests
        run: swift test
      - name: Build, package, and verify app bundle and ZIP
        run: bash Scripts/package-app.sh
      - name: Launch app smoke test
        run: bash Scripts/smoke-test.sh
      - name: Upload finished app ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Quick-Drop-Zone-${{ github.run_number }}
          path: |
            dist/Quick-Drop-Zone-1.2.0.zip
            dist/Quick-Drop-Zone-1.2.0.zip.sha256
          if-no-files-found: error
          retention-days: 30

  capture-readme-media:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/docs/presentation-polish'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Capture the latest Quick Drop Zone release
        env:
          APP_KEY: quick-drop-zone
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/capture-readme-media.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-drop-zone-readme-media
          path: |
            docs/images/quick-drop-zone-light.png
            docs/images/quick-drop-zone-dark.png
            docs/images/quick-drop-zone-hero.gif
            docs/images/social-preview.png
            ${{ runner.temp }}/readme-media/*
          if-no-files-found: warn
          retention-days: 14
