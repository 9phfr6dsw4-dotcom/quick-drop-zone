name: macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test on macOS 26 / latest stable Xcode
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Record and verify Xcode and SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk_version"
          sdk_major="${sdk_version%%.*}"
          test "$sdk_major" -ge 26
      - name: Run tests
        run: swift test
