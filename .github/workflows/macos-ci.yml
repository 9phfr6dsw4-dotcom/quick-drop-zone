name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and package on macOS 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record and verify Xcode and SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk_version"
          sdk_major="${sdk_version%%.*}"
          test "$sdk_major" -ge 26
      - name: Run packaging script tests
        run: python3 Scripts/test_checksum_sidecar.py
      - name: Check the icon definition
        run: python3 Scripts/check-icon-json.py
      - name: Run automated core tests
        run: swift test
      - name: Build, package, and verify app bundle and ZIP
        run: bash Scripts/package-app.sh
      - name: Verify downloadable ZIP checksum sidecar
        run: python3 Scripts/test_checksum_sidecar.py dist/Quick-Drop-Zone-2.3.0.zip
      - name: Launch app smoke test
        run: bash Scripts/smoke-test.sh
      - name: Upload finished app ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Quick-Drop-Zone-${{ github.run_number }}
          path: |
            dist/Quick-Drop-Zone-2.3.0.zip
            dist/Quick-Drop-Zone-2.3.0.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # Publishes a release when main has a version that hasn't been released yet, from the app this
  # run just built and tested. Runs on Linux (cheaper minutes); needs only the uploaded ZIP.
  release:
    name: Publish release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version="$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist', 'rb'))['CFBundleShortVersionString'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      - name: Check whether it's already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the app this run built
        if: steps.existing.outputs.released == 'false'
        uses: actions/download-artifact@v4
        with:
          name: Quick-Drop-Zone-${{ github.run_number }}
          path: release
      - name: Verify the checksum
        if: steps.existing.outputs.released == 'false'
        working-directory: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum -c "Quick-Drop-Zone-$VERSION.zip.sha256"
      - name: Publish
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/releases/$VERSION.md"
          [ -f "$notes" ] || { echo "Missing $notes"; exit 1; }
          gh release create "v$VERSION" "release/Quick-Drop-Zone-$VERSION.zip" "release/Quick-Drop-Zone-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Quick Drop Zone $VERSION" --notes-file "$notes"
